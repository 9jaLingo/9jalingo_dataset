# Render blueprint for the review_console.html companion backend.
# In the Render dashboard: New -> Blueprint -> point at this repo/path.
# HF_TOKEN is marked sync:false -- set it by hand in the Render dashboard's
# Environment tab, never commit a real value here.
#
# REVIEW_TOKEN is deliberately NOT set below, so this deploys with no gate
# on who can call the backend -- the console's UI no longer has a field to
# send one. That means ANYONE who has this service's URL can push shards to
# your Hub repos and read your private/gated source datasets through
# /api/rows and /api/asset. Acceptable if the URL itself stays unshared/
# effectively private; if you ever do share it more widely, add a
# REVIEW_TOKEN env var here (any random string) to lock it back down -- note
# the current console build has no way to supply it, so re-enabling this
# also means restoring the token field review_console.html had before.
#
# NOTE on rootDir below: it's relative to the GITHUB REPO ROOT, not to
# wherever this file happens to sit on disk. For the 9jaLingo/9jalingo_dataset
# repo, that repo root IS the `9jalingo_dataset` folder -- this file lives at
# review_server/render.yaml *within that repo*, so rootDir is just
# "review_server". If you fork/move this into a repo whose root is one level
# higher (containing 9jalingo_dataset/ as a subfolder), change this back to
# "9jalingo_dataset/review_server".
#
# This backend also SERVES the console itself (see main.py) -- once
# deployed, the reviewer link for any language is just:
#   https://<this-service>.onrender.com/review_console.html?lang=<key>
# no separate static hosting required.
services:
  - type: web
    name: 9jalingo-review-backend
    runtime: python
    plan: starter
    rootDir: review_server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin the Python version -- Render's unpinned default has drifted to
      # 3.14, which is too new to have prebuilt wheels yet for pydantic-core
      # (a Rust extension). Without a wheel, pip tries to compile it from
      # source via maturin/cargo, which then fails outright in Render's build
      # sandbox (its cargo registry cache dir is read-only there). 3.11 has
      # full wheel coverage for every dependency here (pydantic-core,
      # pyarrow, soundfile included).
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_TOKEN
        sync: false
      - key: TARGET_REPO_TEMPLATE
        value: voicedata/9jalingo-reviewed-{language}
      - key: TARGET_REPO_PRIVATE
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"   # tighten to this service's own onrender.com URL once you know it, if you don't need other origins
